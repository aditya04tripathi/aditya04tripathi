# Pull-only. Do not add build:.
# Image: ghcr.io/aditya04tripathi/aditya04tripathi
#
# Private package login:
#   echo "$GHCR_TOKEN" | docker login ghcr.io -u aditya04tripathi --password-stdin
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  web:
    image: ghcr.io/aditya04tripathi/aditya04tripathi:${IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      - "${PORT:-49228}:${PORT:-49228}"
    environment:
      PORT: ${PORT:-49228}
    restart: unless-stopped
